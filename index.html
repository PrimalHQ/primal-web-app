<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta property="og:title" content="Primal">
    <meta property="og:description" content="Live Free">
    <meta property="og:image" content="https://primal.net/public/primal-logo-large.png">
    <meta property="og:url" content="https://primal.net">
    <meta property="primal:git-commit-id" content="XXXXXXXXXXXXX-GIT-COMMIT-ID-XXXXXXXXXXXX">

    <link href="/public/fonts.css" rel="stylesheet">

    <script>
      // The /about, /terms and /privacy pages are set in Geist + JetBrains Mono.
      // Start fetching those faces during HTML parse so they are ready before
      // first paint and the text never re-flows from the fallback.
      (function () {
        if (!/^\/(about|terms|privacy)\/?$/.test(location.pathname)) return;
        [
          '/public/Geist/Geist-latin.woff2',
          '/public/JetBrainsMono/JetBrainsMono-latin.woff2'
        ].forEach(function (href) {
          var l = document.createElement('link');
          l.rel = 'preload';
          l.as = 'font';
          l.type = 'font/woff2';
          l.crossOrigin = 'anonymous';
          l.href = href;
          document.head.appendChild(l);
        });
      })();
    </script>

    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Primal" />

    <!-- Icons and manifest mirror tsunami-ssr (same files, same URLs) so the
         switch to tsunami doesn't change icons or PWA installs. The .ico
         carries 16/32/48; the 192 PNG is the high-res choice. Bump ?v= with
         any icon change. /favicon.ico and /apple-touch-icon.png also exist at
         the root (public/) for clients that probe those paths. -->
    <link rel="icon" sizes="32x32" href="/public/favicon.ico?v=4" />
    <link rel="icon" type="image/png" sizes="192x192" href="/public/favicon_192x192.png?v=4" />
    <link
      rel="apple-touch-icon"
      type="image/png"
      sizes="180x180"
      href="/public/apple-touch-icon.png?v=4"
    />
    <link rel="mask-icon" href="/public/safari-pinned-tab.svg?v=4" color="#000000" />

    <!-- Hand-written PWA manifest, served from public/. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Primal</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>

    <script src="/src/index.tsx" type="module"></script>
  </body>
</html>
