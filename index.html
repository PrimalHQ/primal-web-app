<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta property="og:title" content="Primal">
    <meta property="og:description" content="Live Free">
    <meta property="og:image" content="https://primal.net/public/primal-logo-large.png">
    <meta property="og:url" content="https://primal.net">
    <meta property="primal:git-commit-id" content="XXXXXXXXXXXXX-GIT-COMMIT-ID-XXXXXXXXXXXX">

    <link href="/public/fonts.css" rel="stylesheet">

    <script>
      // The /about, /terms and /privacy pages are set in Geist + JetBrains Mono.
      // Start fetching those faces during HTML parse so they are ready before
      // first paint and the text never re-flows from the fallback.
      (function () {
        if (!/^\/(about|terms|privacy)\/?$/.test(location.pathname)) return;
        [
          '/public/Geist/Geist-latin.woff2',
          '/public/JetBrainsMono/JetBrainsMono-latin.woff2'
        ].forEach(function (href) {
          var l = document.createElement('link');
          l.rel = 'preload';
          l.as = 'font';
          l.type = 'font/woff2';
          l.crossOrigin = 'anonymous';
          l.href = href;
          document.head.appendChild(l);
        });
      })();
    </script>

    <link rel="icon" type="image/ico" href="/src/assets/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/src/assets/favicon_32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/src/assets/favicon_16x16.png" />
    <link rel="apple-touch-icon" type="image/png" sizes="180x180" href="/src/assets/apple-touch-icon.png" />
    <link rel="mask-icon" href="/src/assets/safari-pinned-tab.svg" color="#000000" />
    <title>Primal</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>

    <script src="/src/index.tsx" type="module"></script>
  </body>
</html>
